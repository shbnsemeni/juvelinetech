<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You — JuveLineTech</title>
    <meta name="robots" content="noindex">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #F0FDF4; color: #1F2937;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .card {
            background: #fff; border-radius: 20px; padding: 48px 40px;
            text-align: center; max-width: 440px; width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
        }
        .check {
            width: 64px; height: 64px; background: #10B981; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px; font-size: 30px; color: #fff;
        }
        h1 { font-size: 24px; margin-bottom: 8px; }
        p { color: #6B7280; font-size: 15px; line-height: 1.7; margin-bottom: 24px; }
        a {
            display: inline-block; padding: 12px 28px; background: #10B981;
            color: #fff; text-decoration: none; border-radius: 50px;
            font-weight: 600; font-size: 14px;
        }
        a:hover { background: #059669; }
    </style>
</head>
<body>
    <div class="card">
        <div class="check">✓</div>
        <h1>Thank You!</h1>
        <p>Your message has been sent successfully. We'll get back to you within 24 hours.</p>
        <a href="/">Back to Home</a>
    </div>
</body>
</html>
